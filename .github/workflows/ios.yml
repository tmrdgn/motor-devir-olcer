# iOS uygulamasını macOS sunucusunda imzasız derler ve .ipa olarak saklar.
# Telefona kurulum: Sideloadly ile Apple ID üzerinden imzalanır.
name: iOS derleme

# Şimdilik yalnızca elle çalıştırılır (Actions sekmesi → Run workflow).
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capacitor kurulumu
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest
          mkdir -p www && cp ../index.html www/index.html
          npx cap add ios
          npx cap sync ios

      - name: İzin açıklamaları
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Motor sesinden devir ölçmek için mikrofon kullanılır. Ses cihazdan çıkmaz.'" $PL
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Ölçüm için video kaydı yapmak üzere kamera kullanılır.'" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Devir Ölçer'" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Devir Ölçer'" $PL

      - name: Derleme (imzasız)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../DevirOlcer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DevirOlcer-ipa
          path: ios-app/DevirOlcer.ipa
